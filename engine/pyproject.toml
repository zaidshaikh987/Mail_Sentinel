[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsentinel"
version = "1.0.0"
description = "Passive PCAP-based cryptographic security posture assessment for SMTP, IMAP and POP3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SIH 2026 — PS 26159" }]
keywords = ["pcap", "tls", "smtp", "imap", "pop3", "forensics", "security"]

# Deliberately small.  The PCAP/PCAPNG reader, TCP reassembly, TLS handshake
# parser and JA3/JA4 fingerprints are all implemented in-tree, so the only hard
# dependencies are certificate handling, the rule file format, and reporting.
dependencies = [
  "cryptography>=42.0",     # X.509 parsing + PolicyBuilder.time() for capture-clock validation
  "PyYAML>=6.0",            # the rule base
  "Jinja2>=3.1",            # HTML report template
  "certifi>=2024.2.2",      # vendored Mozilla root bundle - no network at runtime
  "weasyprint>=61.0",       # PDF report generation
]

[project.optional-dependencies]
# The model layer.  The engine runs without these: `--no-ml` skips the stage,
# and the rule engine (which produces every verdict) is unaffected.
ml = [
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "joblib>=1.3",
  "shap>=0.44",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["mailsentinel[ml,dev]"]

[project.scripts]
mailsentinel = "mailsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
include = ["mailsentinel*"]

[tool.setuptools.package-data]
"mailsentinel.kb" = ["*.json", "*.yaml"]
"mailsentinel.report" = ["templates/*.j2"]
"mailsentinel.ml" = ["artifacts/*.joblib", "artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:cryptography.*",
]
markers = [
  "slow: tests that train models or run cross-validation",
]
